# External uptime check (DECISIONS D-152; DEPLOYMENT.md → Monitoring and alerts).
#
# Every 10 minutes, from outside the platform (the API cannot report its own
# outage): request the web sign-in page and the API readiness probe, retrying
# so one slow answer is not an outage. While something is down an issue
# labelled `uptime` is open; it is commented at most every
# UPTIME_REMIND_HOURS and closed when everything answers again. Each of those
# three moments sends one e-mail through Resend.
#
# Configure (Settings → Secrets and variables → Actions):
#   secret    RESEND_API_KEY     the Resend API key (same as the API's)
#   variable  ALERT_EMAIL_TO     comma-separated recipients
#   variable  ALERT_EMAIL_FROM   a sender on a domain verified in Resend
#   variable  UPTIME_WEB_URL     default https://dbank.cambobia.com/en/login
#   variable  UPTIME_API_URL     default https://api-production-52b47.up.railway.app/v1/health/ready
#   variable  UPTIME_REMIND_HOURS  default 6
# Without the secret or the recipients the workflow still opens and closes
# the issue (GitHub notifies watchers) and logs a warning instead of e-mailing.
#
# GitHub runs scheduled workflows from the default branch only, may delay a
# run by several minutes under load, and disables the schedule after 60 days
# without repository activity (re-enable it under Actions).
name: Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/uptime-check.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check, keep the uptime issue, e-mail on change
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          UPTIME_WEB_URL: ${{ vars.UPTIME_WEB_URL }}
          UPTIME_API_URL: ${{ vars.UPTIME_API_URL }}
          UPTIME_REMIND_HOURS: ${{ vars.UPTIME_REMIND_HOURS }}
        run: node scripts/uptime-check.mjs
