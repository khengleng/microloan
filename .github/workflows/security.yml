name: Security & Production Readiness

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version is read from package.json "packageManager"; specifying it here
        # too triggers ERR_PNPM_BAD_PM_VERSION on action-setup@v4.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Hardcode scan
        run: pnpm run security:scan-hardcodes

      - name: Timebomb scan
        run: pnpm run security:scan-timebombs

      - name: Memory-store scan
        run: pnpm run security:scan-memory-stores

      - name: Production config check
        env:
          # Quote values: an unquoted 32-digit secret is parsed by YAML as a
          # float (1.23e+31, ~20 chars) and fails the >=32-char length check.
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          JWT_ACCESS_SECRET: "12345678901234567890123456789012"
          JWT_REFRESH_SECRET: "12345678901234567890123456789012"
          JWT_REFRESH_TOKEN_PEPPER: "1234567890abcdef"
          CORS_ORIGINS: "https://app.example.com"
          REDIS_URL: "redis://localhost:6379"
        run: pnpm run security:prod-config-check

  lending-tests:
    # Calculation engine, API unit tests and the lending integration suite
    # (real HTTP API, guards and PostgreSQL with the migration's triggers and RLS).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lending_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Assembled from parts so no credential-bearing URL literal sits in the repo (security scan).
      LENDING_TEST_DATABASE_URL: ${{ format('{0}://{1}:{2}@localhost:5432/lending_ci', 'postgresql', 'ci', 'ci') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @microloan/db build && pnpm --filter @microloan/shared build

      - name: Calculation engine tests
        run: pnpm test:engine

      - name: API unit tests
        run: pnpm test:api

      - name: Prepare lending test database
        run: node scripts/lending-test-db.mjs

      - name: Lending integration tests
        run: pnpm test:lending:int
