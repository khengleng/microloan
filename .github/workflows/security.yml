name: Security & Production Readiness

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version is read from package.json "packageManager"; specifying it here
        # too triggers ERR_PNPM_BAD_PM_VERSION on action-setup@v4.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Hardcode scan
        run: pnpm run security:scan-hardcodes

      - name: Timebomb scan
        run: pnpm run security:scan-timebombs

      - name: Memory-store scan
        run: pnpm run security:scan-memory-stores

      - name: Production config check
        env:
          # Quote values: an unquoted 32-digit secret is parsed by YAML as a
          # float (1.23e+31, ~20 chars) and fails the >=32-char length check.
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          JWT_ACCESS_SECRET: "12345678901234567890123456789012"
          JWT_REFRESH_SECRET: "12345678901234567890123456789012"
          JWT_REFRESH_TOKEN_PEPPER: "1234567890abcdef"
          CORS_ORIGINS: "https://app.example.com"
          REDIS_URL: "redis://localhost:6379"
        run: pnpm run security:prod-config-check
